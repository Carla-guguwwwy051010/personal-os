    html, body { background: #EBF3F8; color: #2C3E50; font-family: 'PingFang SC', Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

    /* ============== Modal ============== */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(40, 50, 70, 0.45); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s; }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
    .modal-panel { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(40, 50, 70, 0.20); overflow: hidden; display: flex; flex-direction: column; animation: slideUp 0.25s; }
    @media (min-width: 640px) { .modal-panel { border-radius: 28px; } }
    .modal-header { padding: 20px 24px 12px; border-bottom: 1px solid #F0F6FA; display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 16px 24px; flex: 1; overflow-y: auto; }
    .modal-footer { padding: 16px 24px 24px; display: flex; gap: 12px; justify-content: flex-end; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: #6B7C8C; margin-bottom: 6px; margin-top: 12px; }
    .field-label:first-child { margin-top: 0; }
    .field-input, .field-select, .field-textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid #E8EEF3; background: #F8FBFD; border-radius: 12px;
      font-size: 14px; color: #2C3E50; outline: none; font-family: inherit; transition: all 0.15s;
    }
    .field-textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: #FFB6C1; background: #fff; box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.15); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .check-toggle { display: inline-flex; align-items: center; cursor: pointer; user-select: none; padding: 6px 10px; border-radius: 999px; font-size: 12px; background: #F0F6FA; color: #6B7C8C; transition: all 0.15s; }
    .check-toggle.on { background: #E5F4E0; color: #5C9C58; }

    /* 滚动条 */
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Bunny 浮动动画 */
    @keyframes bunny-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes bunny-bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes bunny-blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes bubble-in { 0% { opacity: 0; transform: translateY(10px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

    .bunny { animation: bunny-float 3s ease-in-out infinite; }
    .bunny-bounce { animation: bunny-bounce 0.5s ease; }
    .bunny-body { animation: bunny-blink 4s ease-in-out infinite; transform-origin: center; }

    .bubble { animation: bubble-in 0.25s ease-out; }

    /* Tailwind check mark */
    button { transition: all 0.2s ease; }
    button:active { transform: scale(0.97); }

    .slide-in { animation: slide-in 0.3s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

    .modal-backdrop { background: rgba(45, 60, 80, 0.3); backdrop-filter: blur(4px); }

    /* 心情打分 */
    .mood-dot { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; cursor: pointer; }
    .mood-dot.active { transform: scale(1.15); box-shadow: 0 4px 12px rgba(255,182,193,0.4); }

    /* 课程记录横向滚动 */
    .timeline-line { position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #FFD6E0 0%, transparent 100%); }

    // ============================================================
    // State
    // ============================================================
    const STORAGE_KEY = 'pos.data.v1';

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          // 浅合并：保存的覆盖 mockData，但保留 mockData 新增的字段
          return { ...mockData, ...parsed };
        }
      } catch (e) { console.warn('Failed to load saved data', e); }
      return mockData;
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (e) { console.warn('Failed to save data', e); }
    }

    function commit() {
      saveData();
      render();
    }

    // 仅保存数据不重绘（用于 debounce 自动保存，避免打断用户输入）
    function commitSilent() {
      saveData();
    }

    // ============== 每日记录辅助函数 ==============
    // 获取指定日期的记录（无则返回 null）
    function findDailyRecord(date) {
      return (state.data.dailyRecords || []).find(r => r.date === date) || null;
    }

    // 获取/创建指定日期的记录（默认今天）；不存在则用默认值创建并入库
    function ensureDailyRecord(date) {
      date = date || todayISO();
      if (!state.data.dailyRecords) state.data.dailyRecords = [];
      let rec = state.data.dailyRecords.find(r => r.date === date);
      if (!rec) {
        rec = { id: 'dr-' + uuid().slice(3, 8), date, mood: 3, energy: 50, keywords: [], moodNote: '', summary: '', createdAt: nowISO(), updatedAt: nowISO() };
        state.data.dailyRecords.push(rec);
      }
      return rec;
    }

    const state = {
      lang: localStorage.getItem('pos.lang') || 'zh-CN',
      route: location.hash.replace(/^#/, '') || '/',
      data: loadData(),
      bunnyOpen: false,
      modal: null,
    };

    window.addEventListener('hashchange', () => {
      state.route = location.hash.replace(/^#/, '') || '/';
      render();
      window.scrollTo(0, 0);
    });

    function navigate(path) {
      location.hash = path;
    }

    function setLang(lang) {
      state.lang = lang;
      localStorage.setItem('pos.lang', lang);
      render();
    }

    function toggleBunny() {
      state.bunnyOpen = !state.bunnyOpen;
      renderBunny();
    }

    // ============== 今日状态 交互函数 ==============
    // 当前查看的日期（支持 #/journal/today?date=YYYY-MM-DD）
    function journalCurrentDate() {
      const q = location.hash.split('?date=')[1];
      return (q ? q.split('&')[0] : '') || todayISO();
    }
    // 从 DOM 同步能量/笔记/总结到记录（不保存，防止重绘丢失未存输入）
    function journalSyncFromDOM(rec) {
      const en = document.getElementById('journal-energy');
      const nt = document.getElementById('journal-moodnote');
      const sm = document.getElementById('journal-summary');
      if (en) rec.energy = Number(en.value);
      if (nt) rec.moodNote = nt.value;
      if (sm) rec.summary = sm.value;
    }
    function journalSetMood(date, mood) {
      const rec = ensureDailyRecord(date);
      journalSyncFromDOM(rec);
      rec.mood = mood;
      rec.updatedAt = nowISO();
      commit();
    }
    function journalEnergyInput(val) {
      const lbl = document.getElementById('journal-energy-val');
      if (lbl) lbl.textContent = val + '%';
      journalScheduleAutoSave();
    }
    let _journalSaveTimer = null;
    function journalScheduleAutoSave() {
      clearTimeout(_journalSaveTimer);
      _journalSaveTimer = setTimeout(() => {
        const rec = ensureDailyRecord(journalCurrentDate());
        journalSyncFromDOM(rec);
        rec.updatedAt = nowISO();
        commitSilent();
        const hint = document.getElementById('journal-autosave-hint');
        if (hint) { hint.textContent = state.lang === 'zh-CN' ? '已自动保存' : 'Auto-saved'; hint.style.opacity = '1'; setTimeout(() => { if (hint) hint.style.opacity = '0'; }, 1500); }
      }, 700);
    }
    function journalSaveManual(date) {
      const rec = ensureDailyRecord(date);
      journalSyncFromDOM(rec);
      rec.updatedAt = nowISO();
      commitSilent();
      showToast(state.lang === 'zh-CN' ? '✅ 今日记录已保存' : '✅ Saved');
    }
    function journalAddKeyword(date) {
      const isZh = state.lang === 'zh-CN';
      openModal({
        title: isZh ? '新增关键词' : 'New Keyword',
        fields: [{ key: 'text', label: isZh ? '关键词' : 'Keyword', type: 'text', required: true, placeholder: isZh ? '如：专注' : 'e.g. Focus' }],
        onSubmit: (data) => {
          if (!data.text) return false;
          const rec = ensureDailyRecord(date);
          journalSyncFromDOM(rec);
          if (!rec.keywords) rec.keywords = [];
          rec.keywords.push({ id: 'kw-' + uuid().slice(3, 8), text: data.text });
          rec.updatedAt = nowISO();
          commit();
        },
      });
    }
    function journalEditKeyword(date, kwId) {
      const isZh = state.lang === 'zh-CN';
      const rec = ensureDailyRecord(date);
      const kw = (rec.keywords || []).find(k => k.id === kwId);
      if (!kw) return;
      openModal({
        title: isZh ? '编辑关键词' : 'Edit Keyword',
        fields: [{ key: 'text', label: isZh ? '关键词' : 'Keyword', type: 'text', required: true, value: kw.text }],
        onSubmit: (data) => {
          if (!data.text) return false;
          journalSyncFromDOM(rec);
          kw.text = data.text;
          rec.updatedAt = nowISO();
          commit();
        },
        onDelete: () => {
          journalSyncFromDOM(rec);
          rec.keywords = rec.keywords.filter(k => k.id !== kwId);
          rec.updatedAt = nowISO();
          commit();
        },
      });
    }
    function journalDeleteKeyword(date, kwId) {
      const rec = ensureDailyRecord(date);
      journalSyncFromDOM(rec);
      rec.keywords = (rec.keywords || []).filter(k => k.id !== kwId);
      rec.updatedAt = nowISO();
      commit();
    }

    function uuid() {
      return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowISO() {
      return new Date().toISOString();
    }

    /**
     * 通用 Modal 弹窗
     * @param {Object} opts
     *   - title: 弹窗标题
     *   - fields: 字段数组 [{ key, label, type: 'text'|'textarea'|'select'|'date'|'number'|'tags', placeholder?, options?: [{value,label}], value?, required? }]
     *   - submitText: 按钮文案（默认"保存"）
     *   - onSubmit: (formData) => void — 当用户点击保存时调用
     *   - deleteText: 设为有值时显示删除按钮
     *   - onDelete: () => void
     */
    function openModal({ title, fields = [], submitText, deleteText, onSubmit, onDelete }) {
      const existing = document.getElementById('pos-modal');
      if (existing) existing.remove();

      const isZh = state.lang === 'zh-CN';
      const fieldHtml = fields.map((f, i) => {
        const id = `f_${i}`;
        const req = f.required ? '<span class="text-red-400 ml-1">*</span>' : '';
        if (f.type === 'textarea') {
          return `<label class="field-label" for="${id}">${f.label}${req}</label>
            <textarea id="${id}" class="field-textarea" placeholder="${f.placeholder || ''}">${f.value || ''}</textarea>`;
        }
        if (f.type === 'select') {
          const opts = (f.options || []).map(o => {
            const sel = String(o.value) === String(f.value) ? 'selected' : '';
            return `<option value="${o.value}" ${sel}>${o.label}</option>`;
          }).join('');
          return `<label class="field-label" for="${id}">${f.label}${req}</label>
            <select id="${id}" class="field-select">${opts}</select>`;
        }
        if (f.type === 'tags') {
          return `<label class="field-label" for="${id}">${f.label}${req}</label>
            <input id="${id}" type="text" class="field-input" placeholder="${f.placeholder || (isZh ? '用空格分隔' : 'space-separated')}" value="${(f.value || []).join(' ')}" />`;
        }
        if (f.type === 'date') {
          return `<label class="field-label" for="${id}">${f.label}${req}</label>
            <input id="${id}" type="date" class="field-input" value="${f.value || todayISO()}" />`;
        }
        if (f.type === 'number') {
          return `<label class="field-label" for="${id}">${f.label}${req}</label>
            <input id="${id}" type="number" step="${f.step || '1'}" class="field-input" placeholder="${f.placeholder || ''}" value="${f.value ?? ''}" />`;
        }
        // default 'text'
        return `<label class="field-label" for="${id}">${f.label}${req}</label>
          <input id="${id}" type="text" class="field-input" placeholder="${f.placeholder || ''}" value="${f.value || ''}" />`;
      }).join('');

      const html = `
        <div id="pos-modal" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h2 class="text-base font-semibold text-text-primary">${title}</h2>
              <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-bg-base text-text-muted flex items-center justify-center hover:bg-bg-card transition" aria-label="Close">✕</button>
            </div>
            <div class="modal-body">
              ${fieldHtml}
            </div>
            <div class="modal-footer">
              ${onDelete ? `<button onclick="window.__posDeleteHandler()" class="pill bg-red-50 text-red-500 px-4 py-2 text-sm flex items-center gap-1 hover:bg-red-100 transition">
                ${icon('trash', 14)} ${deleteText || (isZh ? '删除' : 'Delete')}
              </button>` : ''}
              <div class="flex-1"></div>
              <button onclick="closeModal()" class="pill bg-bg-base text-text-primary px-4 py-2 text-sm hover:bg-bg-card transition">${isZh ? '取消' : 'Cancel'}</button>
              <button id="pos-modal-submit" class="pill bg-bunny-pink text-white px-4 py-2 text-sm hover:bg-bunny-blush transition">${submitText || (isZh ? '保存' : 'Save')}</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);

      // 提交处理
      document.getElementById('pos-modal-submit').onclick = () => {
        const data = {};
        fields.forEach((f, i) => {
          const el = document.getElementById(`f_${i}`);
          let v = el.value;
          if (f.type === 'tags') v = v.trim() ? v.trim().split(/\s+/) : [];
          else if (f.type === 'number') v = v === '' ? '' : Number(v);
          data[f.key] = v;
        });
        if (onSubmit) {
          const ok = onSubmit(data);
          if (ok === false) return; // 阻止关闭
          closeModal();
        } else {
          closeModal();
        }
      };

      if (onDelete) window.__posDeleteHandler = onDelete;

      // ESC 关闭
      const escHandler = (e) => { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escHandler); } };
      document.addEventListener('keydown', escHandler);
    }

    function closeModal() {
      const m = document.getElementById('pos-modal');
      if (m) m.remove();
    }

      openModal({
        title: isEdit ? (isZh ? '编辑项目' : 'Edit Project') : (isZh ? '新建项目' : 'New Project'),
        fields: [
          { key: 'name', label: isZh ? '项目名' : 'Name', type: 'text', required: true, value: project?.name },
          { key: 'goal', label: isZh ? '目标' : 'Goal', type: 'textarea', value: project?.goal, placeholder: isZh ? '1-2 句话描述项目目标' : '1-2 sentences describing the goal' },
          {
            key: 'stage', label: isZh ? '阶段' : 'Stage', type: 'select', value: project?.stage || 'discovery',
            options: PM_STAGE_ORDER.map(s => ({ value: s, label: t(PM_STAGE_LABEL[s]) })),
          },
          { key: 'members', label: isZh ? '团队成员（用空格分隔）' : 'Members (space-separated)', type: 'tags', value: project?.members },
          { key: 'startDate', label: isZh ? '开始日期' : 'Start Date', type: 'date', value: project?.startDate || todayISO() },
          { key: 'targetLaunchDate', label: isZh ? '目标上线（可选）' : 'Target Launch (optional)', type: 'date', value: project?.targetLaunchDate },
          { key: 'retrospective', label: isZh ? '复盘（可选）' : 'Retrospective (optional)', type: 'textarea', value: project?.retrospective },
        ],
        onSubmit: (data) => {
          if (!data.name) { alert(isZh ? '请填写项目名' : 'Name is required'); return false; }
          if (isEdit) {
            Object.assign(project, data, { updatedAt: nowISO() });

          },
          { key: 'dueAt', label: isZh ? '截止（可选）' : 'Due (optional)', type: 'date', value: task?.dueAt },
          { key: 'deliverable', label: isZh ? '交付物' : 'Deliverable', type: 'textarea', value: task?.deliverable, placeholder: isZh ? '完成时交付的内容' : 'What will you deliver?' },
          { key: 'tags', label: isZh ? '标签' : 'Tags', type: 'tags', value: task?.tags },
          { key: 'retrospective', label: isZh ? '复盘 / 阻塞说明（可选）' : 'Retrospective / Block reason (optional)', type: 'textarea', value: task?.retrospective },
        ],
        onSubmit: (data) => {
          if (!data.name) { alert(isZh ? '请填写任务名' : 'Task name is required'); return false; }
          // 状态为 done 时补 finishedAt，供本周复盘统计使用
          if (data.status === 'done') { data.finishedAt = (isEdit && task.finishedAt) || todayISO(); }
          else { data.finishedAt = undefined; }
          if (isEdit) {
            Object.assign(task, data, { updatedAt: nowISO() });
          } else {
            const newT = { id: 'pt-' + uuid().slice(3, 8), ...data, createdAt: nowISO(), updatedAt: nowISO() };
            state.data.pmTasks.push(newT);
          }
          commit();
        },
        ...(isEdit ? {
          onDelete: () => {
            if (!confirmAction((isZh ? '确定删除任务 "' : 'Delete task "') + task.name + '"?')) return;
            state.data.pmTasks = state.data.pmTasks.filter(t => t.id !== task.id);
            commit();
          }
        } : {}),
      });
    }

    function togglePMTaskStatus(taskOrId) {
      // 支持传入 id 字符串或任务对象（inline onclick 只能安全传 id 字符串）
      const task = typeof taskOrId === 'string'
        ? state.data.pmTasks.find(t => t.id === taskOrId)
        : taskOrId;
      if (!task) return;
      // 轮转状态：todo → doing → done → todo；blocked 不参与自动轮转
      if (task.status === 'blocked') {
        task.status = 'todo';
      } else if (task.status === 'todo') {
        task.status = 'doing';
      } else if (task.status === 'doing') {
        task.status = 'done';
      } else {
        task.status = 'todo';
      }
      task.updatedAt = nowISO();
      // done 时打上 finishedAt，供本周复盘统计使用；离开 done 时清除
      if (task.status === 'done') task.finishedAt = todayISO();
      else delete task.finishedAt;
      commit();
    }

                                ${task.retrospective && task.status === 'blocked' ? `<p class="mt-2 rounded-xl bg-red-50 px-2.5 py-1.5 text-[11px] leading-relaxed text-red-500"><span class="font-medium">${t('pm.block')}: </span>${task.retrospective}</p>` : ''}

                          </div>

    // ISO 周次辅助
    function isoWeek(d) {
      const date = new Date(d);
      const target = new Date(date.valueOf());
      const dayNr = (date.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
      }
      const weekNum = 1 + Math.ceil((firstThursday - target) / 604800000);
      return `${date.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
    }

    // ============== 方案 A + D 通用函数 ==============
    // 获取本周日期范围（如 2026-07-28 ~ 2026-08-03）
    function getWeekRange() {
      const now = new Date();
      const dayOfWeek = (now.getDay() + 6) % 7; // 周一=0, 周日=6
      const monday = new Date(now);
      monday.setDate(now.getDate() - dayOfWeek);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      return `${fmt(monday)} ~ ${fmt(sunday)}`;
    }

    // 获取本周起始 ISO 字符串（用于 date 比较）
    function getWeekStartISO() {
      const now = new Date();
      const dayOfWeek = (now.getDay() + 6) % 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - dayOfWeek);
      monday.setHours(0, 0, 0, 0);
      return monday.toISOString().slice(0, 10);
    }

    // 聚合 7 天内 9 个集合的活动条数
    function getLast7DaysStat() {
      const days = [];
      const now = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(now.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const dayLabel = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
        days.push({ iso, label: dayLabel, count: 0 });
      }
      const dateFields = ['createdAt', 'date', 'updatedAt', 'capturedAt', 'finishedAt'];
      const collections = ['pmPRDs', 'pmWeeklyReports', 'pmCompetitorAnalyses', 'pmProductMechanics', 'pmUserInsights', 'pmDataAnalyses', 'pmPrompts', 'pmAIWorkflows', 'pmCareerGrowth', 'pmAIOutputs'];
      collections.forEach((key) => {
        const arr = state.data[key] || [];
        arr.forEach((item) => {
          dateFields.forEach((field) => {
            const v = item[field];
            if (typeof v === 'string' && v.length >= 10) {
              const iso = v.slice(0, 10);
              const day = days.find((x) => x.iso === iso);
              if (day) day.count += 1;
            }
          });
        });
      });
      return days;
    }

    // 本周任务完成数 + 洞察/Prompt/数据分析新增数
    function getWeekStats() {
      const weekStart = getWeekStartISO();
      const isThisWeek = (iso) => typeof iso === 'string' && iso.slice(0, 10) >= weekStart;
      let taskDone = 0;
      (state.data.pmTasks || []).forEach((tk) => {
        if (tk.status === 'done' && isThisWeek(tk.finishedAt || tk.updatedAt)) taskDone += 1;
      });
      const concerns = {
        taskDone,
        insights: (state.data.pmUserInsights || []).filter((x) => isThisWeek(x.createdAt)).length,
        prompts: (state.data.pmPrompts || []).filter((x) => isThisWeek(x.createdAt)).length,
        analyses: (state.data.pmDataAnalyses || []).filter((x) => isThisWeek(x.date || x.createdAt)).length,
      };
      return concerns;
    }

    // Toast 提示（轻量）
    function showToast(msg) {
      let toast = document.getElementById('pos-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'pos-toast';
        toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-text-primary text-white px-4 py-2 rounded-2xl shadow-elevated text-sm z-50 transition-opacity';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
    }

    // 复制 Prompt 到剪贴板
    function copyPrompt(id) {
      const p = (state.data.pmPrompts || []).find((x) => x.id === id);
      if (!p) return;
      const text = p.content || '';
      const onOk = () => showToast(t('pm.copied'));
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onOk).catch(() => fallbackCopy(text, onOk));
      } else {
        fallbackCopy(text, onOk);
      }
    }
    function fallbackCopy(text, onOk) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onOk && onOk(); } catch (e) {}
      document.body.removeChild(ta);
    }

    // 一键生成周报（驾驶舱用）
    function generateWeeklyReport() {
      const weekStart = getWeekStartISO();
      const now = new Date();
      const monday = new Date(now);
      const dayOfWeek = (now.getDay() + 6) % 7;
      monday.setDate(now.getDate() - dayOfWeek);
      const doneTasks = [];
      (state.data.pmTasks || []).forEach((tk) => {
        if (tk.status === 'done' && (tk.finishedAt || tk.updatedAt || '').slice(0, 10) >= weekStart) {
          const proj = state.data.pmProjects.find(p => p.id === tk.projectId);
          doneTasks.push(`✓ ${proj ? proj.name : '—'} · ${tk.name}`);
        }
      });
      const newInsights = (state.data.pmUserInsights || []).filter((x) => (x.createdAt || '').slice(0, 10) >= weekStart);
      const newPrompts = (state.data.pmPrompts || []).filter((x) => (x.createdAt || '').slice(0, 10) >= weekStart);
      const newAnalyses = (state.data.pmDataAnalyses || []).filter((x) => (x.date || x.createdAt || '').slice(0, 10) >= weekStart);
      const aiDone = doneTasks.length ? doneTasks.slice(0, 5).join('\n') + (doneTasks.length > 5 ? `\n…等共 ${doneTasks.length} 项` : '') : '本周暂无完成的 PM 任务';
      const aiInsights = newInsights.length ? newInsights.map((i) => `• ${(i.feedback || '').slice(0, 50)}`).join('\n') : '本周暂无新洞察';
      const aiNext = `• 聚焦 PM 知识库 3 个核心：PRD / 洞察 / AI 中心\n• 推进 1 个真实项目到下个里程碑\n• 复盘 1 篇深度文章（候选：${newPrompts[0]?.name || '本周 Prompt'}）`;
      const draft = {
        done: `【${t('pm.aiSimulated')}】\n${aiDone}\n\n📊 数据：新增 ${newInsights.length} 条洞察 / ${newPrompts.length} 条 Prompt / ${newAnalyses.length} 条数据分析`,
        thinking: `【${t('pm.aiSimulated')}】\n本周观察：${newInsights.length ? '用户反馈集中在"' + (newInsights[0]?.scenario || '记录与反思') + '"主题' : '本周无新洞察'}; ${doneTasks.length > 5 ? '执行力稳定' : doneTasks.length > 0 ? '任务完成偏少' : '任务推进需要加强'}`,
        nextPlan: `【${t('pm.aiSimulated')}】\n${aiNext}`,
      };
      const isZh = state.lang === 'zh-CN';
      const weekLabel = isoWeek(monday.toISOString());
      const draftPreview = `${t('pm.aiDraftPreview')}（${weekLabel}）\n\n📅 完成：\n${draft.done}\n\n💭 思考：\n${draft.thinking}\n\n→ 下周计划：\n${draft.nextPlan}`;
      openModal({
        title: `✨ ${t('pm.aiDraftPreview')} · ${weekLabel}`,
        fields: [
          { key: 'done', label: '📅 Done', type: 'textarea', value: draft.done, required: true },
          { key: 'thinking', label: '💭 Thinking', type: 'textarea', value: draft.thinking, required: true },
          { key: 'nextPlan', label: '→ Next Plan', type: 'textarea', value: draft.nextPlan, required: true },
        ],
        onSubmit: (data) => {
          if (!data.done || !data.thinking || !data.nextPlan) return false;
          const item = {
            id: 'wr-' + uuid().slice(3, 8),
            week: weekLabel,
            date: todayISO(),
            done: data.done,
            thinking: data.thinking,
            nextPlan: data.nextPlan,
          };
          state.data.pmWeeklyReports = state.data.pmWeeklyReports || [];
          state.data.pmWeeklyReports.unshift(item);
          commit();
          showToast(t('pm.generationDone'));
          navigate('/pm/assets?tab=weekly');
          return true;
        },
      });
    }

    // 打开 AI 产出详情（只读 + 可复制）
    function openAIOutputModal(o) {
      openModal({
        title: `🤖 ${o.title || 'AI 产出'}`,
        fields: [
          { key: 'source', label: t('pm.aiOutputSource'), type: 'text', value: (o.sourceType === 'prompt' ? '✨ ' : '⚙️ ') + (o.sourceTitle || '—') },
          { key: 'input', label: t('pm.aiOutputInput'), type: 'textarea', value: o.input || '' },
          { key: 'output', label: t('pm.aiOutputOutput'), type: 'textarea', value: o.output || '' },
        ],
        onSubmit: (data) => {
          // 仅编辑输入和输出
          o.title = o.title;
          o.input = data.input;
          o.output = data.output;
          commit();
          return true;
        },
        ...(o ? { onDelete: () => {
          if (!confirmAction(state.lang === 'zh-CN' ? '删除这条 AI 产出？' : 'Delete this output?')) return;
          state.data.pmAIOutputs = state.data.pmAIOutputs.filter((x) => x.id !== o.id);
          commit();
        } } : {}),
      });
    }

    // 复制 AI 产出全文到剪贴板
    function copyAIOutput(id) {
      const o = (state.data.pmAIOutputs || []).find((x) => x.id === id);
      if (!o) return;
      const text = `${o.title || ''}\n\n${o.output || ''}`;
      const onOk = () => showToast(t('pm.copied'));
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onOk).catch(() => fallbackCopy(text, onOk));
      } else {
        fallbackCopy(text, onOk);
      }
    }

    // ============== 体验放松：计划 / 完整记录 / 周复盘 CRUD ==============
    // 体验类型分类
    const EXP_CATEGORY = {
      sport: { emoji: '🏃', tagClass: 'tag-green', zh: '运动', en: 'Sport' },
      entertainment: { emoji: '🎮', tagClass: 'tag-orange', zh: '娱乐', en: 'Entertainment' },
      study: { emoji: '📚', tagClass: 'tag-blue', zh: '学习', en: 'Study' },
      social: { emoji: '👥', tagClass: 'tag-pink', zh: '社交', en: 'Social' },
      food: { emoji: '🍜', tagClass: 'tag-rose', zh: '美食', en: 'Food' },
      travel: { emoji: '✈️', tagClass: 'tag-purple', zh: '旅行', en: 'Travel' },
      other: { emoji: '✨', tagClass: 'tag', zh: '其他', en: 'Other' },
    };
    function expCatLabel(k) { const c = EXP_CATEGORY[k] || EXP_CATEGORY.other; return state.lang === 'zh-CN' ? c.zh : c.en; }

    // 格式化：yyyy-mm-dd hh:mm
    function fmtDateTime(d) {
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // 新增/编辑今日放松计划
    function openRelaxPlanModal(plan) {
      const isEdit = !!plan;
      const isZh = state.lang === 'zh-CN';
      openModal({
        title: isEdit ? (isZh ? '编辑放松计划' : 'Edit Plan') : (isZh ? '添加放松计划' : 'Add Relax Plan'),
        fields: [
          { key: 'name', label: isZh ? '放松事项' : 'Plan', type: 'text', required: true, value: plan?.name, placeholder: isZh ? '如：散步30分钟 / 看电影' : 'e.g. Walk 30 min' },
        ],
        onSubmit: (data) => {
          if (!data.name) { alert(isZh ? '请填写放松事项' : 'Required'); return false; }
          if (isEdit) {
            plan.name = data.name;
          } else {
            if (!state.data.relaxPlans) state.data.relaxPlans = [];
            state.data.relaxPlans.unshift({ id: 'rp-' + uuid().slice(3, 8), name: data.name, status: 'pending', createdAt: fmtDateTime(new Date()), completedAt: '' });
          }
          commit();
        },
        ...(isEdit ? { onDelete: () => {
          if (!confirmAction(isZh ? '删除这个计划？' : 'Delete this plan?')) return;
          state.data.relaxPlans = state.data.relaxPlans.filter(p => p.id !== plan.id);
          commit();
        } } : {}),
      });
    }

    // 完成放松计划 → 状态流转 pending→completed + 自动生成活动记录
    function completeRelaxPlan(planId) {
      const plan = (state.data.relaxPlans || []).find(p => p.id === planId);
      if (!plan || plan.status === 'completed') return;
      plan.status = 'completed';
      plan.completedAt = fmtDateTime(new Date());
      // 自动生成活动记录（携带活动名 + 完成时间，其余待用户补充）
      if (!state.data.experienceRecords) state.data.experienceRecords = [];
      const rec = { id: 'er2-' + uuid().slice(3, 8), activityName: plan.name, time: plan.completedAt, location: '', type: 'other', rating: 0, happyMoment: '', discovery: '', photos: [], createdAt: nowISO(), fromPlanId: plan.id };
      state.data.experienceRecords.unshift(rec);
      commit();
      showToast(state.lang === 'zh-CN' ? '✅ 已完成，已生成活动记录' : '✅ Done, record created');
    }

    // 新增/编辑完整活动记录
    function openExperienceRecordModal(rec) {
      const isEdit = !!rec;

          { key: 'time', label: isZh ? '时间' : 'Time', type: 'text', value: rec?.time || fmtDateTime(new Date()), placeholder: 'yyyy-mm-dd hh:mm' },
          { key: 'location', label: isZh ? '地点' : 'Location', type: 'text', value: rec?.location, placeholder: isZh ? '家 / 公园 / 电影院' : 'Home / Park' },
          { key: 'type', label: isZh ? '类型' : 'Type', type: 'select', value: rec?.type || 'other', options: Object.keys(EXP_CATEGORY).map(k => ({ value: k, label: `${EXP_CATEGORY[k].emoji} ${expCatLabel(k)}` })) },
          { key: 'rating', label: isZh ? '评分（1-5星）' : 'Rating (1-5)', type: 'number', value: rec?.rating || '', placeholder: '5' },
          { key: 'happyMoment', label: isZh ? '最开心瞬间' : 'Happy Moment', type: 'textarea', value: rec?.happyMoment },
          { key: 'discovery', label: isZh ? '新发现 / 收获' : 'Discovery', type: 'textarea', value: rec?.discovery },

    function openHealthStepsModal(existing) {
      const isZh = state.lang === 'zh-CN';
      const today = todayISO();
      const record = existing || state.data.healthRecords.steps.find(s => s.date === today) || { date: today, count: 0 };
      openModal({
        title: isZh ? '记录步数' : 'Log Steps',
        fields: [
          { key: 'date', label: isZh ? '日期' : 'Date', type: 'date', value: record.date, required: true },
          { key: 'count', label: isZh ? '步数' : 'Count', type: 'number', value: record.count ?? 0, required: true, placeholder: '0' },
        ],
        onSubmit: (data) => {
          if (data.count === '' || data.count < 0) { alert(isZh ? '请填写步数' : 'Count is required'); return false; }
          const idx = state.data.healthRecords.steps.findIndex(s => s.date === record.date);
          if (idx >= 0) {
            state.data.healthRecords.steps[idx] = { date: data.date, count: Number(data.count) };
          } else {
            state.data.healthRecords.steps.push({ date: data.date, count: Number(data.count) });
            state.data.healthRecords.steps.sort((a, b) => b.date.localeCompare(a.date));
          }
          commit();
        },
      });
    }

    function openHealthSleepModal(existing) {
      const isZh = state.lang === 'zh-CN';
      const today = todayISO();
      const record = existing || state.data.healthRecords.sleep.find(s => s.date === today) || { date: today, hours: 7.5, quality: 4 };
      openModal({
        title: isZh ? '记录睡眠' : 'Log Sleep',
        fields: [
          { key: 'date', label: isZh ? '日期（哪晚）' : 'Date (which night)', type: 'date', value: record.date, required: true },
          { key: 'hours', label: isZh ? '时长（小时）' : 'Hours', type: 'number', step: '0.1', value: record.hours ?? 7.5, required: true, placeholder: '7.5' },
          {
            key: 'quality', label: isZh ? '质量' : 'Quality', type: 'select', value: String(record.quality ?? 4),
            options: [
              { value: '3', label: `🙂 ${t('health.sleepQuality3')}` },
              { value: '4', label: `😊 ${t('health.sleepQuality4')}` },
              { value: '5', label: `🌟 ${t('health.sleepQuality5')}` },
            ],
          },
        ],
        onSubmit: (data) => {
          if (!data.hours) { alert(isZh ? '请填写睡眠时长' : 'Hours required'); return false; }
          const idx = state.data.healthRecords.sleep.findIndex(s => s.date === record.date);
          const newRec = { date: data.date, hours: Number(data.hours), quality: Number(data.quality) };
          if (idx >= 0) {
            state.data.healthRecords.sleep[idx] = newRec;
          } else {
            state.data.healthRecords.sleep.push(newRec);
            state.data.healthRecords.sleep.sort((a, b) => b.date.localeCompare(a.date));
          }
          commit();

    function openHealthWorkoutModal(workout) {
      const isEdit = !!workout;
      const isZh = state.lang === 'zh-CN';
      openModal({
        title: isEdit ? (isZh ? '编辑运动' : 'Edit Workout') : (isZh ? '记录运动' : 'Log Workout'),
        fields: [
          {
            key: 'type', label: isZh ? '类型' : 'Type', type: 'select', value: workout?.type || 'yoga',
            options: Object.keys(WORKOUT_TYPE_META).map(k => ({ value: k, label: `${WORKOUT_TYPE_META[k].emoji} ${t(WORKOUT_TYPE_META[k].labelKey)}` })),
          },
          { key: 'date', label: isZh ? '日期' : 'Date', type: 'date', value: workout?.date || todayISO(), required: true },
          { key: 'duration', label: isZh ? '时长（分钟）' : 'Duration (min)', type: 'number', value: workout?.duration ?? 30, required: true },
          {
            key: 'intensity', label: isZh ? '强度' : 'Intensity', type: 'select', value: workout?.intensity || 'medium',
            options: Object.keys(INTENSITY_TAG).map(k => ({ value: k, label: t(INTENSITY_LABEL[k]) })),
          },
          { key: 'note', label: isZh ? '备注' : 'Note', type: 'textarea', value: workout?.note, placeholder: isZh ? '训练内容、感受等' : 'What did you do?' },
        ],
        onSubmit: (data) => {
          if (!data.duration) { alert(isZh ? '请填写时长' : 'Duration required'); return false; }
          if (isEdit) {
            Object.assign(workout, data);
          } else {
            const newW = { id: 'wk-' + uuid().slice(3, 8), ...data };
            state.data.healthRecords.workouts.unshift(newW);
          }
          commit();
        },
        ...(isEdit ? {
          onDelete: () => {
            if (!confirmAction(isZh ? '确定删除这次运动？' : 'Delete this workout?')) return;
            state.data.healthRecords.workouts = state.data.healthRecords.workouts.filter(w => w.id !== workout.id);
            commit();
          }
        } : {}),
      });
    }

    // ============================================================
    // Routing
    // ============================================================
    function renderPage() {
      const r = state.route;
      if (r === '/' || r === '') return pageDashboard();
      if (r.startsWith('/journal')) return pageJournal();
      if (r === '/tutoring') return pageTutoring();
      if (r.startsWith('/tutoring/students/')) {
        const id = r.split('/')[3];
        return pageStudentDetail(id);
      }
      if (r === '/creation' || r === '/creation/today') return pageCreation();
      if (r.startsWith('/creation/projects/')) {
        const id = r.split('/')[3];
        return pageProjectDetail(id);
      }
      if (r === '/settings') return pageSettings();
      if (r === '/pm') return pagePM();
      if (r.startsWith('/pm/projects/')) {
        const id = r.split('/')[3];
        return pagePMProjectDetail(id);
      }
      if (r.startsWith('/pm/assets')) return pagePMAssets();
      if (r.startsWith('/pm/insights')) return pagePMInsights();
      if (r.startsWith('/pm/data')) return pagePMData();
      if (r.startsWith('/pm/ai')) return pagePMAI();
      if (r.startsWith('/pm/career')) return pagePMCareer();
      if (r === '/learning' || r.startsWith('/learning/')) {
        if (r === '/learning') return pageLearningDashboard();
        if (r === '/learning/reading') return pageLearningReading();
        if (r === '/learning/ielts') return pageLearningIELTS();
        if (r.startsWith('/learning/exams/')) {
          const examId = r.split('/')[3];
          return pageLearningExamDetail(examId);
        }
        if (r === '/learning/exams') return pageLearningExams();
        if (r === '/learning/ai') return pageLearningAI();
        if (r === '/learning/interest') return pageLearningInterest();
        return pageLearningDashboard(); // fallback
      }
      if (r === '/health') return pageHealth();
      if (r === '/experience') return pageExperience();
      return `<div class="p-8 text-center text-text-muted">404</div>`;
    }

    function renderBunny() {
      const old = document.getElementById('bunny-widget');
      const html = bunnyFloating();
      if (old) old.outerHTML = html;
      else document.body.insertAdjacentHTML('beforeend', html);
    }

      const app = document.getElementById('app');

          ${sidebar()}
          ${topbar()}
          <main class="min-h-screen">
            ${renderPage()}

    window.exportData = function() {
      const payload = {
        meta: { schemaVersion: '0.1.0-preview', exportedAt: new Date().toISOString(), appName: 'personal-os-preview' },
        data: state.data,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `personal-os-preview-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // ============================================================
    // Init
    // ============================================================
    render();

    // Bunny drag (basic)
    let bunnyPos = null;
    let bunnyDragging = false;
    document.addEventListener('mousedown', e => {
      const target = e.target.closest('#bunny-floater');
      if (!target) return;
      bunnyDragging = true;
      const widget = document.getElementById('bunny-widget');
      const rect = widget.getBoundingClientRect();
      bunnyPos = { x: e.clientX - rect.right, y: e.clientY - rect.bottom };
    });
    document.addEventListener('mousemove', e => {
      if (!bunnyDragging || !bunnyPos) return;
      const widget = document.getElementById('bunny-widget');
      const newRight = Math.max(16, -bunnyPos.x + (e.clientX - bunnyPos.x));
      const newBottom = Math.max(80, -bunnyPos.y + (e.clientY - bunnyPos.y));
      widget.style.right = (window.innerWidth - widget.getBoundingClientRect().right - 30) + 'px';
      // 简化：直接更改 right/bottom
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
      widget.style.left = (e.clientX - 40) + 'px';
      widget.style.top = (e.clientY - 40) + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (bunnyDragging) {
        setTimeout(() => { bunnyDragging = false; }, 50);
      }
    });
  </script>
</body>
</html>
